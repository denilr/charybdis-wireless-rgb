## Prospector dongle variant for hardware with the APDS9960 ambient light sensor fitted.

CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y

# The 280Zo Prospector fork has the patched APDS9960 behavior
# this dongle needs. Keep Zephyr's stock APDS9960 driver
# out of this build so both drivers do not bind the same
# sensor at the same time.
CONFIG_APDS9960=n
CONFIG_PROSPECTOR_APDS9960=y

# Brightness range
# Minimum (dark rooms)
CONFIG_PROSPECTOR_ALS_MIN_BRIGHTNESS=20      
# Maximum (USB power)
CONFIG_PROSPECTOR_ALS_MAX_BRIGHTNESS_USB=100  

# Smooth fade transitions
# 800ms fade
CONFIG_PROSPECTOR_BRIGHTNESS_FADE_DURATION_MS=800 
# 12 steps
CONFIG_PROSPECTOR_BRIGHTNESS_FADE_STEPS=12         

# Auto-dim when no keyboard activity
# 8 minutes (0=disabled)
CONFIG_PROSPECTOR_SCANNER_TIMEOUT_MS=480000  
# Dim to 5%    
CONFIG_PROSPECTOR_SCANNER_TIMEOUT_BRIGHTNESS=5   